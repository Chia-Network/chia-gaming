<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#000000" />
    <title>Chia Gaming</title>
  </head>
  <body id="body">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      (function () {
        var appRoot = new URL('./', window.location.href);
        fetch(new URL('build-meta.json', appRoot), { cache: 'no-store' })
          .then(function (r) {
            return r.json();
          })
          .then(function (meta) {
            var base = document.createElement('base');
            base.href = new URL(meta.basePath.replace(/^\/+/, ''), appRoot).href;
            document.head.appendChild(base);

            var icon = document.createElement('link');
            icon.rel = 'icon';
            icon.type = 'image/svg+xml';
            icon.href = 'favicon.svg';
            document.head.appendChild(icon);

            var css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = 'index.css';
            document.head.appendChild(css);

            var app = document.createElement('script');
            app.src = 'index.js';
            document.body.appendChild(app);
          })
          .catch(function (err) {
            document.getElementById('root').textContent =
              'Failed to load build metadata: ' + err.message;
          });
      })();
    </script>
  </body>
</html>
