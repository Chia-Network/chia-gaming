minimumReleaseAge: 1440 # 24 hours
packages:
  - "desktop"
  - "front-end"
  - "hub/hub-frontend"
  - "hub/hub-service"
  - "shared/*"

confirmModulesPurge: false

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  # Postinstall downloads the Electron binary for the desktop app.
  electron: true

patchedDependencies:
  "@walletconnect/sign-client@2.23.10": front-end/patches/@walletconnect__sign-client@2.23.10.patch
  "@walletconnect/safe-json@1.0.2": front-end/patches/@walletconnect__safe-json@1.0.2.patch
