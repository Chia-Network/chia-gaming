name: Electron desktop

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'long_lived/**'
  release:
    types: [published]
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_VERSION: stable

jobs:
  build:
    name: Build Electron (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            os: macos-13-arm64
            artifact: chia-gaming-electron-macos
          - platform: win
            os: windows-latest
            artifact: chia-gaming-electron-windows
          - platform: linux
            os: ubuntu-22.04
            artifact: chia-gaming-electron-linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0

      - name: Install WASI SDK
        if: runner.os == 'macOS'
        env:
          WASI_SDK_VERSION: '33'
          WASI_SDK_SHA256: 85c997a2665ead91673b5bb88b7d0df3fc8900df3bfa244f720d478187bbdc78
        run: |
          archive="$RUNNER_TEMP/wasi-sdk.tar.gz"
          install_dir="$RUNNER_TEMP/wasi-sdk"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-arm64-macos.tar.gz"
          echo "${WASI_SDK_SHA256}  ${archive}" | shasum -a 256 --check
          mkdir -p "$install_dir"
          tar -xzf "$archive" --strip-components=1 -C "$install_dir"
          echo "CC_wasm32_unknown_unknown=$install_dir/bin/clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$install_dir/bin/llvm-ar" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Check for Apple signing credentials
        if: matrix.platform == 'mac' && github.event_name != 'pull_request'
        id: apple-signing
        shell: bash
        env:
          APPLE_DEV_ID_APP: ${{ secrets.APPLE_DEV_ID_APP }}
          APPLE_DEV_ID_APP_PASS: ${{ secrets.APPLE_DEV_ID_APP_PASS }}
          APPLE_NOTARIZE_USERNAME: ${{ secrets.APPLE_NOTARIZE_USERNAME }}
          APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          configured=0
          for value in \
            "$APPLE_DEV_ID_APP" \
            "$APPLE_DEV_ID_APP_PASS" \
            "$APPLE_NOTARIZE_USERNAME" \
            "$APPLE_NOTARIZE_PASSWORD" \
            "$APPLE_TEAM_ID"; do
            if [[ -n "$value" ]]; then
              configured=$((configured + 1))
            fi
          done

          if [[ "$configured" -eq 5 ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [[ "$configured" -eq 0 ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Apple signing is partially configured; all five Apple secrets are required"
            exit 1
          fi

      - name: Import Apple app signing certificate
        if: steps.apple-signing.outputs.available == 'true'
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DEV_ID_APP }}
          p12-password: ${{ secrets.APPLE_DEV_ID_APP_PASS }}

      - name: Check for Windows signing credentials
        if: matrix.platform == 'win' && github.event_name != 'pull_request'
        id: windows-signing
        shell: bash
        env:
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_HOST: ${{ secrets.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}
          SM_CERTKEY_ALIAS: ${{ secrets.SM_CERTKEY_ALIAS }}
        run: |
          configured=0
          for value in \
            "$SM_CLIENT_CERT_FILE_B64" \
            "$SM_CLIENT_CERT_PASSWORD" \
            "$SM_HOST" \
            "$SM_API_KEY" \
            "$SM_CODE_SIGNING_CERT_SHA1_HASH" \
            "$SM_CERTKEY_ALIAS"; do
            if [[ -n "$value" ]]; then
              configured=$((configured + 1))
            fi
          done

          if [[ "$configured" -eq 6 ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [[ "$configured" -eq 0 ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Windows signing is partially configured; all six DigiCert secrets are required"
            exit 1
          fi

      - name: Configure DigiCert Signing Manager
        if: steps.windows-signing.outputs.available == 'true'
        shell: bash
        env:
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_HOST: ${{ secrets.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}
        run: |
          cert_file="D:/Certificate_pkcs12.p12"
          echo "$SM_CLIENT_CERT_FILE_B64" | base64 --decode > /d/Certificate_pkcs12.p12
          {
            echo "SM_HOST=$SM_HOST"
            echo "SM_API_KEY=$SM_API_KEY"
            echo "SM_CLIENT_CERT_FILE=$cert_file"
            echo "SM_CLIENT_CERT_PASSWORD=$SM_CLIENT_CERT_PASSWORD"
            echo "SM_CODE_SIGNING_CERT_SHA1_HASH=$SM_CODE_SIGNING_CERT_SHA1_HASH"
          } >> "$GITHUB_ENV"
          {
            echo "C:/Program Files (x86)/Windows Kits/10/App Certification Kit"
            echo "C:/Program Files (x86)/Microsoft SDKs/Windows/v10.0A/bin/NETFX 4.8 Tools"
            echo "C:/Program Files/DigiCert/DigiCert One Signing Manager Tools"
          } >> "$GITHUB_PATH"

      - name: Install DigiCert Signing Manager tools
        if: steps.windows-signing.outputs.available == 'true'
        shell: cmd
        run: |
          curl -X GET https://download.chia.net/dc/smtools-windows-x64.msi -o smtools-windows-x64.msi
          start "" /wait msiexec.exe /i smtools-windows-x64.msi /qn /norestart
          set "installer_exit=%ERRORLEVEL%"
          if not "%installer_exit%"=="0" if not "%installer_exit%"=="3010" exit /b %installer_exit%
          smksp_registrar.exe list
          smctl.exe keypair ls
          C:\Windows\System32\certutil.exe -csp "DigiCert Signing Manager KSP" -key -user
          smctl.exe windows certsync --keypair-alias=${{ secrets.SM_CERTKEY_ALIAS }}

      - name: Build signed Electron installer
        if: steps.apple-signing.outputs.available == 'true'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.APPLE_DEV_ID_APP }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_DEV_ID_APP_PASS }}
        run: tools/build-electron.sh --platform=${{ matrix.platform }}

      - name: Build signed Windows Electron installer
        if: steps.windows-signing.outputs.available == 'true'
        shell: bash
        env:
          HAS_SIGNING_SECRET: 'true'
        run: tools/build-electron.sh --platform=${{ matrix.platform }}

      - name: Build unsigned Electron installer
        if: steps.apple-signing.outputs.available != 'true' && steps.windows-signing.outputs.available != 'true'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: tools/build-electron.sh --platform=${{ matrix.platform }}

      - name: Notarize and staple macOS installers
        if: steps.apple-signing.outputs.available == 'true'
        shell: bash
        env:
          APPLE_NOTARIZE_USERNAME: ${{ secrets.APPLE_NOTARIZE_USERNAME }}
          APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for dmg in desktop/release/*.dmg; do
            xcrun notarytool submit \
              --wait \
              --apple-id "$APPLE_NOTARIZE_USERNAME" \
              --password "$APPLE_NOTARIZE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              "$dmg"
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
