# Build and Test (Linux x86_64) github action for chia-gaming
name: build-test.yml

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}--${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/long_lived/')) && github.sha || '' }}
  cancel-in-progress: true

env:
  GRCOV_VERSION: 0.8.1
  RUST_VERSION: stable

on:
  push:
    branches:
      - base
      - dev
  release:
    types: [published]
  pull_request:
    branches:
      - '**'

permissions:
  id-token: write
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-22.04
    name: cargo fmt
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "clippy, rustfmt"
      - name: fmt
        run: |
          rustup component add --toolchain stable-x86_64-unknown-linux-gnu clippy rustfmt
          cargo fmt --version
          cargo fmt -- --files-with-diff --check

  clippy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "clippy, rustfmt"
      - name: Build hex files
        run: tools/build-chialisp.sh
      - name: clippy
        run: |
          set -x
          rustup component add --toolchain stable-x86_64-unknown-linux-gnu clippy rustfmt
          cargo clippy --version
          cargo clippy --all --features=sim-tests,sim-server -- -D warnings
          cargo check --features=sim-tests,sim-server --tests

  unit_tests:
    runs-on: ubuntu-22.04
    name: Unit tests - build-test.yml
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "clippy, rustfmt"

      - name: Test chialisp build orchestration
        run: tools/test-build-chialisp.sh

      - name: Build hex files
        run: |
          tools/build-chialisp.sh

      - name: Run rust tests and simulator tests
        run: |
          # Build without sim-tests to ensure that configuration compiles
          cargo test --no-run
          # Run simulator tests (matches local ct.sh)
          cargo test --lib --features sim-tests,sim-server -- --nocapture

  release:
    runs-on: ubuntu-22.04
    name: Build deploy tarballs (Linux)
    if: github.event_name == 'release'
    needs: [unit_tests]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Build deploy tarballs
        run: tools/build-deploy.sh --release-version=${{ github.event.release.tag_name }}

      - name: Verify deploy archives
        run: tools/test-deploy-archives.sh --release-version=${{ github.event.release.tag_name }}

      - name: Generate deploy checksums
        run: |
          (
            cd deploy_player_app
            sha256sum chia-gaming-*
          ) > SHA256SUMS-web.txt
          (
            cd deploy_hub
            sha256sum chia-gaming-hub-*
          ) >> SHA256SUMS-web.txt

      - name: Upload player app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chia-gaming-${{ github.event.release.tag_name }}
          path: |
            deploy_player_app/chia-gaming-${{ github.event.release.tag_name }}.tgz
            deploy_player_app/chia-gaming-${{ github.event.release.tag_name }}.zip

      - name: Upload hub artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chia-gaming-hub-${{ github.event.release.tag_name }}
          path: |
            deploy_hub/chia-gaming-hub-${{ github.event.release.tag_name }}.tgz
            deploy_hub/chia-gaming-hub-${{ github.event.release.tag_name }}.zip
            SHA256SUMS-web.txt

      - name: Upload deploy archives to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            deploy_player_app/chia-gaming-"$RELEASE_TAG".tgz \
            deploy_player_app/chia-gaming-"$RELEASE_TAG".zip \
            deploy_hub/chia-gaming-hub-"$RELEASE_TAG".tgz \
            deploy_hub/chia-gaming-hub-"$RELEASE_TAG".zip \
            SHA256SUMS-web.txt

  coverage:
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "clippy, rustfmt"
      - name: Build hex files
        run: tools/build-chialisp.sh
      - name: Run for coverage
        run: |
          rustup component add llvm-tools-preview
          cargo install --version $GRCOV_VERSION grcov
          export RUSTFLAGS="-Cinstrument-coverage"
          export LLVM_PROFILE_FILE=$(pwd)/target/chialisp-%p-%m.profraw
          export CARGO_TARGET_DIR=$(pwd)/target
          cargo test --lib --features sim-tests,sim-server -- --nocapture
          grcov . --binary-path target -s . --branch --ignore-not-existing --ignore='*/.cargo/*' --ignore='*/tests/*' -o rust_cov.info
          python3 -c 'with open("rust_cov.info") as f: lines = [l for l in f if not (l.startswith("DA:") and int(l.split(",")[1].strip()) >= 2**63)]; open("lcov.info", "w").writelines(lines)'
      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        with:
          path-to-lcov: './lcov.info'
