[package]
name = "chia_gaming"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A series of protocols that enable state-channels and gaming for the Chia blockchain."
authors = [
    "Art Yerkes <art.yerkes@gmail.com>",
    "Adam Kelly <adam@chia.net>",
    "Matt Howard <matt@chia.net>",
]
homepage = "https://github.com/Chia-Network/chia-gaming/"
repository = "https://github.com/Chia-Network/chia-gaming/"

[features]
sim-tests = []
sim-server = [
    "sim-tests",
    "dep:axum",
    "dep:futures-util",
    "dep:tokio",
    "dep:tokio-tungstenite",
]
used_linker = []

[dependencies]
bencodex = { path = "bencodex" }
blst = { version = "=0.3.17", features = ["portable"] }
chia-bls = "=0.52.1"
chia-consensus = "=0.52.1"
chia-protocol = "=0.52.1"
chia-puzzles = "=0.20.3"
chialisp = { git = "https://github.com/Chia-Network/chialisp.git", rev = "286a343940b50bc6b2d2f8488c53f069c9cff2c8" }
clvm-traits = "=0.52.1"
clvm-utils = "=0.52.1"
clvmr = { git = "https://github.com/Chia-Network/clvm_rs.git", rev = "05e31346107b7d0defc6c9055f7efd32ac81d498", features = ["pre-eval"] }
hex = "=0.4.3"
lazy_static = "=1.5.1"
num-bigint = "=0.5.1"
num-traits = "=0.2.19"
rand = "=0.10.3"
rand_chacha = "=0.10.0"
serde = { version = "=1.0.228", features = ["rc"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
typetag = "=0.2.23"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"], optional = true }
tokio-tungstenite = { version = "=0.30.0", optional = true }
futures-util = { version = "=0.3.34", features = ["sink"], optional = true }
axum = { version = "=0.8.9", features = ["ws"], optional = true }

[build-dependencies]
# Chialisp emits an unhashed cdylib/rlib for host and target builds. Keep
# shared dependency features aligned so those builds use identical types.
getrandom = { version = "=0.4.3", features = ["std"] }
rand_chacha = "=0.9.0"
serde = { version = "=1.0.228", features = ["alloc", "rc"] }
serde_core = "=1.0.228"
chialisp = { git = "https://github.com/Chia-Network/chialisp.git", rev = "286a343940b50bc6b2d2f8488c53f069c9cff2c8" }
clvm-utils = "=0.52.1"
clvmr = { git = "https://github.com/Chia-Network/clvm_rs.git", rev = "05e31346107b7d0defc6c9055f7efd32ac81d498", features = ["pre-eval"] }
hex = "=0.4.3"
serde_json = "=1.0.154"
sha2 = "=0.11.1"
toml = "=1.1.8"

[[bin]]
name = "chia-gaming-sim"
path = "src/bin/simulator.rs"
required-features = ["sim-server"]

[[bin]]
name = "gen-krunk-dict"
path = "games/krunk/rust/bin_gen_krunk_dict.rs"

[[bench]]
name = "clvm_success"
harness = false

[lib]
name = "chia_gaming"
crate-type = ["rlib"]

[patch.crates-io]
clvmr = { git = "https://github.com/Chia-Network/clvm_rs.git", rev = "05e31346107b7d0defc6c9055f7efd32ac81d498" }
